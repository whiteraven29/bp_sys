# Ansible reads this file when you run it from this folder:
#
#     cd ops/ansible
#     ansible-playbook site.yml --check --diff
#
# Guide: ops/guides/04-ansible.md

[defaults]
inventory = inventory.ini
retry_files_enabled = False
# Show task results as readable YAML instead of one long JSON line.
callback_result_format = yaml
interpreter_python = auto_silent

[privilege_escalation]
# You log in as yourself and Ansible uses sudo, so it asks for your sudo password
# once per run ("BECOME password"). That is the password sudo asks for on the
# server, not an SSH login. If your account needs no sudo password, press Enter.
become_ask_pass = True

[ssh_connection]
# Faster: sends each task over the open SSH connection instead of copying files.
pipelining = True
