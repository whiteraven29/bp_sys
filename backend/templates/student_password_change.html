<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your password — EduTrack</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#070b12;color:#f4f7fb;font-family:Inter,system-ui,sans-serif}
    main{width:min(440px,100%);padding:24px;border:1px solid #243247;border-radius:16px;background:#101722}
    .mark{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#55a7ff;color:#07111c;font-weight:900}
    h1{margin:20px 0 8px;font-size:1.5rem}p{margin:0 0 18px;color:#9aa8ba;line-height:1.55;font-size:.88rem}
    label{display:block;margin:13px 0 6px;color:#b9c5d3;font-size:.75rem;font-weight:700}input{width:100%;padding:13px;border:1px solid #2b3b51;border-radius:10px;background:#070b12;color:#fff;font-size:1rem;outline:none}input:focus{border-color:#55a7ff}.password-wrap{position:relative;width:100%}.password-wrap input{padding-right:46px}.password-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:32px;height:32px;margin:0;padding:0;border:0;border-radius:7px;color:#55a7ff;background:transparent;cursor:pointer}.password-toggle:hover,.password-toggle:focus-visible{background:rgba(85,167,255,.14);outline:none}
    ul{padding-left:20px;color:#9aa8ba;font-size:.78rem;line-height:1.7}button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:#55a7ff;color:#07111c;font-weight:850;cursor:pointer}.error{min-height:20px;margin-top:12px;color:#ff7b8a;font-size:.8rem}.identity{color:#55a7ff;font-size:.76rem;font-weight:750}
  </style>
</head>
<body><main>
  <div hidden>{% csrf_token %}</div>
  <div class="mark">E</div>
  <h1>Create a secure password</h1>
  <p class="identity">{{ student_name }} · {{ registration_number }}</p>
  <p>Your current PIN is temporary. Create a password before accessing the student portal.</p>
  <ul><li>At least 8 characters</li><li>One uppercase and one lowercase letter</li><li>One number and one symbol</li></ul>
  <label for="current">Generated PIN</label><input id="current" type="password" autocomplete="current-password">
  <label for="next">New password</label><input id="next" type="password" autocomplete="new-password">
  <label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password">
  <button id="save" type="button">Save password and continue</button><div class="error" id="error" role="alert"></div>
</main><script>
const error=document.getElementById('error');
document.querySelectorAll('input[type="password"]').forEach(input=>{const wrap=document.createElement('div');wrap.className='password-wrap';input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);const button=document.createElement('button');button.type='button';button.className='password-toggle';button.setAttribute('aria-label','Show password');button.textContent='👁';button.onclick=()=>{const hidden=input.type==='password';input.type=hidden?'text':'password';button.textContent=hidden?'◉':'👁';button.setAttribute('aria-label',hidden?'Hide password':'Show password');input.focus()};wrap.appendChild(button)});
function cookie(name){return document.cookie.split(';').map(v=>v.trim()).find(v=>v.startsWith(name+'='))?.split('=')[1]||''}
document.getElementById('save').addEventListener('click',async()=>{const current=document.getElementById('current').value;const next=document.getElementById('next').value;const confirm=document.getElementById('confirm').value;error.textContent='';if(next!==confirm){error.textContent='The new passwords do not match.';return}if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(next)){error.textContent='Use at least 8 characters with uppercase, lowercase, a number, and a symbol.';return}const button=document.getElementById('save');button.disabled=true;try{const response=await fetch('/api/change-password/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':cookie('csrftoken')},credentials:'same-origin',body:JSON.stringify({current_password:current,new_password:next})});const data=await response.json();if(!response.ok)throw data;location.href='{% url "student-dashboard" %}'}catch(e){error.textContent=e.detail||'Could not update password.';button.disabled=false}});
</script></body></html>
