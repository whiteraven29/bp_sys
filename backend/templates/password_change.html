{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
  <title>Change your password — EduTrack</title>
  <style>
    :root {
      --bg: #eceff3; --surface: #ffffff; --surface2: #f3f5f7; --border: #ccd4dc;
      --accent: #123F80; --accent-dark: #0C2D5E; --accent-soft: #EFF6FF;
      --red: #dc2626; --text: #2b3440; --muted: #71808f; --radius: 3px;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--text); font-family: var(--font-sans);
    }
    main {
      width: min(460px, 100%); border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--surface); overflow: hidden;
    }
    .head { display: flex; align-items: center; gap: 11px; padding: 16px 20px; background: var(--accent); color: #fff; }
    .mark {
      display: grid; place-items: center; width: 36px; height: 36px; flex: 0 0 auto;
      border-radius: var(--radius); background: #fff; color: var(--accent); font-weight: 700;
    }
    .head strong { display: block; font-size: .98rem; font-weight: 600; }
    .head small { display: block; margin-top: 2px; color: rgba(255,255,255,.85); font-size: .74rem; }
    .body { padding: 20px; }
    h1 { font-size: 1.12rem; font-weight: 600; margin-bottom: 5px; }
    .identity { color: var(--muted); font-size: .8rem; margin-bottom: 12px; }
    .lead { color: var(--text); font-size: .84rem; line-height: 1.6; margin-bottom: 14px; }
    /* Requirements read as a notice, not body copy — same strip pattern the
       portal uses for informational messages. */
    .rules {
      padding: 11px 14px; margin-bottom: 18px;
      border: 1px solid #cfe0f5; border-left: 3px solid var(--accent);
      border-radius: var(--radius); background: var(--accent-soft);
    }
    .rules strong { display: block; margin-bottom: 5px; font-size: .8rem; font-weight: 600; }
    .rules ul { padding-left: 18px; color: var(--text); font-size: .8rem; line-height: 1.65; }
    label { display: block; margin: 0 0 6px; color: var(--text); font-size: .8rem; font-weight: 500; }
    .field { margin-bottom: 14px; }
    input {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius);
      background: #fff; color: var(--text); font-family: var(--font-sans); font-size: .88rem; outline: none;
      transition: border-color .13s;
    }
    input:focus { border-color: var(--accent); }
    .password-wrap { position: relative; width: 100%; }
    .password-wrap input { padding-right: 40px; }
    .password-toggle {
      position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
      display: grid; place-items: center; width: 30px; height: 30px; margin: 0; padding: 0;
      border: 0; border-radius: var(--radius); color: var(--accent); background: transparent; cursor: pointer;
    }
    .password-toggle:hover, .password-toggle:focus-visible { background: var(--accent-soft); outline: none; }
    button {
      width: 100%; margin-top: 4px; padding: 10px; border: 1px solid var(--accent);
      border-radius: var(--radius); background: var(--accent); color: #fff;
      font-family: var(--font-sans); font-size: .9rem; font-weight: 500; cursor: pointer;
      transition: background .13s, border-color .13s;
    }
    button:hover:not(:disabled) { background: var(--accent-dark); border-color: var(--accent-dark); }
    button:disabled { opacity: .6; cursor: default; }
    .error:not(:empty) {
      margin-top: 13px; padding: 10px 13px; font-size: .82rem; color: var(--text);
      background: #fdeded; border: 1px solid #eab8b8; border-left: 3px solid var(--red);
      border-radius: var(--radius);
    }
  
  /* DESIGN SYSTEM (said 21 October 2026): primary blue #123F80, light blue
     #EFF6FF, white, cool grey #F1F5F9 — the dashboards' tokens and shapes. */
  :root {
    --bg: #F1F5F9; --surface: #FFFFFF; --surface2: #F8FAFC; --border: #E2E8F0;
    --accent: #123F80; --accent-dark: #0C2D5E; --accent-soft: #EFF6FF;
    --text: #1E293B; --muted: #64748B; --radius: 10px;
  }
  body { -webkit-font-smoothing: antialiased; }
  .shell, main, .card { border: 0 !important; border-radius: 18px !important; box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 12px 32px rgba(15,23,42,.10); overflow: hidden; }
  .brand-side, .head { background: linear-gradient(160deg, #123F80 0%, #0C2D5E 100%) !important; }
  .brand-mark, .mark { border-radius: 10px !important; color: #123F80 !important; }
  .field input, .field select, .field textarea, input[type=text], input[type=password], input[type=email], select, textarea {
    border-radius: 8px !important; border-color: #CBD5E1; }
  .field input:focus, input:focus, select:focus, textarea:focus { border-color: #123F80 !important; box-shadow: 0 0 0 3px rgba(18,63,128,.14); outline: none; }
  .btn, .submit, button[type=submit] { border-radius: 8px !important; font-weight: 600 !important; }
  .rules, .lead-box { border-radius: 10px !important; }
  @media (max-width: 640px) { .shell, main, .card { border-radius: 0 !important; box-shadow: none; } }
</style>
</head>
<body><main>
  <div hidden>{% csrf_token %}</div>
  <div class="head">
    <div class="mark">ET</div>
    <div><strong>EduTrack</strong><small>{{ college_name }}</small></div>
  </div>
  <div class="body">
    <h1>{{ heading }}</h1>
    <p class="identity">{{ full_name }} · {{ username }}</p>
    <p class="lead">{{ lead }}</p>
    <div class="rules">
      <strong>Your password must have</strong>
      <ul><li>At least 8 characters</li><li>One uppercase and one lowercase letter</li><li>One number and one symbol</li></ul>
    </div>
    <div class="field"><label for="current">Current password</label><input id="current" type="password" autocomplete="current-password"></div>
    <div class="field"><label for="next">New password</label><input id="next" type="password" autocomplete="new-password"></div>
    <div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password"></div>
    <button id="save" type="button">Save password and continue</button>
    <div class="error" id="error" role="alert"></div>
  </div>
</main><script>
const error=document.getElementById('error');
document.querySelectorAll('input[type="password"]').forEach(input=>{const wrap=document.createElement('div');wrap.className='password-wrap';input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);const button=document.createElement('button');button.type='button';button.className='password-toggle';button.setAttribute('aria-label','Show password');button.innerHTML='<i class="bi bi-eye"></i>';button.onclick=()=>{const hidden=input.type==='password';input.type=hidden?'text':'password';button.innerHTML=hidden?'<i class="bi bi-eye-slash"></i>':'<i class="bi bi-eye"></i>';button.setAttribute('aria-label',hidden?'Hide password':'Show password');input.focus()};wrap.appendChild(button)});
function cookie(name){return document.cookie.split(';').map(v=>v.trim()).find(v=>v.startsWith(name+'='))?.split('=')[1]||''}
document.getElementById('save').addEventListener('click',async()=>{const current=document.getElementById('current').value;const next=document.getElementById('next').value;const confirm=document.getElementById('confirm').value;error.textContent='';if(next!==confirm){error.textContent='The new passwords do not match.';return}if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(next)){error.textContent='Use at least 8 characters with uppercase, lowercase, a number, and a symbol.';return}const button=document.getElementById('save');button.disabled=true;try{const response=await fetch('/api/change-password/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':cookie('csrftoken')},credentials:'same-origin',body:JSON.stringify({current_password:current,new_password:next})});const data=await response.json();if(!response.ok)throw data;location.href='{% url "frontend" %}'}catch(e){error.textContent=e.detail||'Could not update password.';button.disabled=false}});
</script></body></html>
